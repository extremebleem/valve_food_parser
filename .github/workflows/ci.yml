name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src scripts tests

      - name: Unit tests
        env:
          DRY_RUN: "true"
          DATABASE_URL: "sqlite://:memory:"
        run: pytest --cov=src --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed secrets
        run: |
          set -e
          if git ls-files | grep -E '^\.env$'; then
            echo "::error::a secret-bearing file is tracked by git"; exit 1
          fi
          if git grep -nIE '(TELEGRAM_BOT_TOKEN|GITHUB_TOKEN)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9_:-]{15,}' -- . ':!.github' ':!README.md' ':!docs'; then
            echo "::error::a hardcoded credential was found"; exit 1
          fi
          echo "no committed secrets found"
