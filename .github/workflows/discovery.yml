name: discovery

# The venue list is rebuilt once a day. Discovery is far more expensive than
# monitoring (Overpass is a shared community resource, Google Places charges per
# request) and venues do not open and close every half hour.
on:
  schedule:
    - cron: "17 11 * * *"   # 04:17 America/Los_Angeles in summer, 03:17 in winter
  workflow_dispatch:
    inputs:
      radius:
        description: "Override SEARCH_RADIUS_METERS for this run"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the venue list
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          OFFICE_NAME: ${{ vars.OFFICE_NAME }}
          OFFICE_ADDRESS: ${{ vars.OFFICE_ADDRESS }}
          OFFICE_LAT: ${{ vars.OFFICE_LAT }}
          OFFICE_LON: ${{ vars.OFFICE_LON }}
          OFFICE_TIMEZONE: ${{ vars.OFFICE_TIMEZONE }}
          SEARCH_RADIUS_METERS: ${{ vars.SEARCH_RADIUS_METERS }}
          ENABLE_GOOGLE_DISCOVERY: ${{ vars.ENABLE_GOOGLE_DISCOVERY }}
          ENABLE_FOURSQUARE_DISCOVERY: ${{ vars.ENABLE_FOURSQUARE_DISCOVERY }}
          VENUE_STALE_DAYS: ${{ vars.VENUE_STALE_DAYS }}
          LOG_FORMAT: json
        run: |
          python -m scripts.discover \
            ${{ inputs.radius && format('--radius {0}', inputs.radius) || '' }} \
            --output venues.json

      # An artifact, not a commit: the runtime database must never be written
      # back into git, and this snapshot is only for humans to inspect.
      - name: Upload venue snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venues-${{ github.run_id }}
          path: venues.json
          retention-days: 14
          if-no-files-found: warn
