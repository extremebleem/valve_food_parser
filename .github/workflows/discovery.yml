name: discovery

# The venue list is rebuilt once a day. Discovery is far more expensive than
# monitoring (Overpass is a shared community resource, Google Places charges per
# request) and venues do not open and close every half hour.
on:
  schedule:
    - cron: "17 11 * * *"   # 04:17 America/Los_Angeles in summer, 03:17 in winter
  workflow_dispatch:
    inputs:
      radius:
        description: "Override SEARCH_RADIUS_METERS for this run"
        type: string
        default: ""

permissions:
  contents: read
  actions: write

# discovery writes the venues table, monitor writes everything else. Same
# database, so the two workflows must never interleave.
concurrency:
  group: state
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Choose the state backend
        id: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "mode=postgres" >> "$GITHUB_OUTPUT"
          else
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore state from the previous run
        if: steps.backend.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=monitor-state&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::notice::no previous state artifact -- starting with an empty database"
            exit 0
          fi
          curl -sSL --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
            -o state.zip
          unzip -oq state.zip -d data/
          gunzip -f data/monitor.db.gz
          echo "restored $(du -h data/monitor.db | cut -f1) of state from artifact $id"

      - name: Rebuild the venue list
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/monitor.db' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          OFFICE_NAME: ${{ vars.OFFICE_NAME }}
          OFFICE_ADDRESS: ${{ vars.OFFICE_ADDRESS }}
          OFFICE_LAT: ${{ vars.OFFICE_LAT }}
          OFFICE_LON: ${{ vars.OFFICE_LON }}
          OFFICE_TIMEZONE: ${{ vars.OFFICE_TIMEZONE }}
          SEARCH_RADIUS_METERS: ${{ vars.SEARCH_RADIUS_METERS }}
          ENABLE_GOOGLE_DISCOVERY: ${{ vars.ENABLE_GOOGLE_DISCOVERY }}
          ENABLE_FOURSQUARE_DISCOVERY: ${{ vars.ENABLE_FOURSQUARE_DISCOVERY }}
          VENUE_STALE_DAYS: ${{ vars.VENUE_STALE_DAYS }}
          LOG_FORMAT: json
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.discover \
            ${{ inputs.radius && format('--radius {0}', inputs.radius) || '' }} \
            --output venues.json

      - name: Compress state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db') != ''
        run: gzip -9 -c data/monitor.db > data/monitor.db.gz

      - name: Persist state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: data/monitor.db.gz
          # overwrite:true keeps exactly one copy at a time, so a longer
          # retention costs no extra storage -- it only widens how long the
          # repository can sit idle without losing every baseline.
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # overwrite:true deletes before it uploads, so a run killed in that window
      # would take the only copy with it. One dated snapshot per day is a cheap
      # floor under that risk.
      - name: Dated backup of the state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state-backup-${{ github.run_id }}
          path: data/monitor.db.gz
          retention-days: 14
          if-no-files-found: warn

      # A human-readable snapshot, not state: the venue list as JSON.
      - name: Upload venue snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venues-${{ github.run_id }}
          path: venues.json
          retention-days: 14
          if-no-files-found: warn
