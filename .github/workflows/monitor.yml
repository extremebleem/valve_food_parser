name: monitor

# The cron is expressed in UTC and deliberately spans 0-4,21-23, which is the
# union of 14:00-21:00 America/Los_Angeles under both PDT (UTC-7) and PST
# (UTC-8). The precise window is enforced by ACTIVE_HOURS_START/END against the
# office's local clock, so DST never shifts it: the cron is the coarse filter,
# the code is the authority. 16 ticks/day fire, ~14 actually do work.
#
# Nothing in this system assumes an exact 30-minute cadence -- baselines are
# built from a +/-60 minute local-time window and cooldowns are measured from
# real timestamps, so a late or missed run only costs one data point.
on:
  schedule:
    - cron: "*/30 0-4,21-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send Telegram messages, print them instead"
        type: boolean
        default: false
      limit:
        description: "Only check the N nearest open venues"
        type: string
        default: ""
      log_level:
        description: "Log level"
        type: choice
        options: [INFO, DEBUG, WARNING]
        default: INFO

permissions:
  contents: read
  actions: write   # read the previous state artifact, replace it at the end

# monitor and discovery share one database, so they must never interleave.
concurrency:
  group: state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Cheap gate before any expensive step, so a tick outside the window costs
      # seconds of runner time instead of a full Python setup + install.
      - name: Is the office's local clock inside the active window?
        id: window
        env:
          TZ_NAME: ${{ vars.OFFICE_TIMEZONE || 'America/Los_Angeles' }}
          START: ${{ vars.ACTIVE_HOURS_START || '14' }}
          END: ${{ vars.ACTIVE_HOURS_END || '21' }}
        run: |
          set -eu
          hour=$((10#$(TZ="$TZ_NAME" date +%H)))
          if [ "$START" -eq "$END" ]; then
            active=true
          elif [ "$START" -lt "$END" ]; then
            if [ "$hour" -ge "$START" ] && [ "$hour" -lt "$END" ]; then active=true; else active=false; fi
          else
            if [ "$hour" -ge "$START" ] || [ "$hour" -lt "$END" ]; then active=true; else active=false; fi
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "local hour in $TZ_NAME is $hour; window ${START}-${END} -> active=$active"

      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- state ---------------------------------------------------------- #
      - name: Choose the state backend
        id: backend
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "mode=postgres" >> "$GITHUB_OUTPUT"
            echo "using the external database"
          else
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
            echo "no DATABASE_URL: keeping SQLite state in a workflow artifact"
          fi

      - name: Restore state from the previous run
        if: steps.backend.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          # The repo-level list endpoint does not document an order, so sort by
          # created_at instead of trusting the first element.
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=monitor-state&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::notice::no previous state artifact -- starting with an empty database"
            exit 0
          fi
          curl -sSL --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
            -o state.zip
          unzip -oq state.zip -d data/
          gunzip -f data/monitor.db.gz
          echo "restored $(du -h data/monitor.db | cut -f1) of state from artifact $id"

      # --- the actual run ------------------------------------------------- #
      - name: Run monitoring pass
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/monitor.db' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BESTTIME_API_KEY_PRIVATE: ${{ secrets.BESTTIME_API_KEY_PRIVATE }}
          BESTTIME_API_KEY_PUBLIC: ${{ secrets.BESTTIME_API_KEY_PUBLIC }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Non-secret tuning lives in repository variables so it can be
          # changed from the UI without a commit.
          OFFICE_NAME: ${{ vars.OFFICE_NAME }}
          OFFICE_ADDRESS: ${{ vars.OFFICE_ADDRESS }}
          OFFICE_LAT: ${{ vars.OFFICE_LAT }}
          OFFICE_LON: ${{ vars.OFFICE_LON }}
          OFFICE_TIMEZONE: ${{ vars.OFFICE_TIMEZONE }}
          SEARCH_RADIUS_METERS: ${{ vars.SEARCH_RADIUS_METERS }}
          ANOMALY_MULTIPLIER: ${{ vars.ANOMALY_MULTIPLIER }}
          MIN_BASELINE_SAMPLES: ${{ vars.MIN_BASELINE_SAMPLES }}
          BASELINE_LOOKBACK_WEEKS: ${{ vars.BASELINE_LOOKBACK_WEEKS }}
          BASELINE_WINDOW_MINUTES: ${{ vars.BASELINE_WINDOW_MINUTES }}
          DETECT_DROPS: ${{ vars.DETECT_DROPS }}
          DROP_MULTIPLIER: ${{ vars.DROP_MULTIPLIER }}
          USE_DISTRICT_INDEX: ${{ vars.USE_DISTRICT_INDEX }}
          ALERT_COOLDOWN_MINUTES: ${{ vars.ALERT_COOLDOWN_MINUTES }}
          SEND_RECOVERY_ALERTS: ${{ vars.SEND_RECOVERY_ALERTS }}
          MAX_VENUES_PER_RUN: ${{ vars.MAX_VENUES_PER_RUN }}
          ASSUME_OPEN_WHEN_UNKNOWN: ${{ vars.ASSUME_OPEN_WHEN_UNKNOWN }}
          STORE_RAW_VALUE: ${{ vars.STORE_RAW_VALUE }}
          ACTIVE_HOURS_START: ${{ vars.ACTIVE_HOURS_START || '14' }}
          ACTIVE_HOURS_END: ${{ vars.ACTIVE_HOURS_END || '21' }}
          ACTIVE_WEEKDAYS: ${{ vars.ACTIVE_WEEKDAYS }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
          LOG_FORMAT: json
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.monitor \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ github.event_name == 'workflow_dispatch' && '--ignore-window' || '' }}

      # Housekeeping: keep the observations table bounded.
      #
      # 70 days is BASELINE_LOOKBACK_WEEKS (8 weeks = 56 days) plus two weeks of
      # slack. Retaining longer buys nothing -- the baseline query never looks
      # past the horizon -- and it would push the table past a free-tier limit.
      - name: Purge observations older than the baseline horizon
        if: steps.window.outputs.active == 'true' && success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/monitor.db' }}
          RETENTION_DAYS: ${{ vars.OBSERVATION_RETENTION_DAYS || '70' }}
        run: |
          if [ "$(date -u +%M)" -lt 30 ]; then
            python -m scripts.monitor --purge-days "$RETENTION_DAYS" --purge-only || true
          else
            echo "skipping purge this run"
          fi

      # Persist even when the run failed: the state written before the failure
      # is still worth more than starting over.
      - name: Compress state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db') != ''
        run: |
          gzip -9 -c data/monitor.db > data/monitor.db.gz
          ls -lh data/monitor.db data/monitor.db.gz

      - name: Persist state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: data/monitor.db.gz
          retention-days: 7
          overwrite: true
          if-no-files-found: error
