name: watch

# GitHub's scheduler has never fired for this repository: over five hours with
# three different cron expressions, `event=schedule` stayed at total_count=0
# while manual dispatches worked every time. The cadence therefore does not
# depend on it.
#
# Instead each job loops internally for WATCH_MAX_RUNTIME seconds, checking
# every WATCH_INTERVAL seconds, and then dispatches the next job itself. The
# schedule below is kept as a second entry point in case it ever wakes up; the
# `state` concurrency group makes an overlap harmless.
#
# Self-dispatch needs a PAT: GitHub deliberately refuses to start a new run
# from an event raised with the built-in GITHUB_TOKEN, to prevent recursion.
# Without WORKFLOW_CHAIN_TOKEN the job simply ends and the chain stops.
#
# The cadence is set by the cheapest, most valuable subject. Everything slower
# carries its own min_interval_minutes (see src/subjects.py), so a typical run
# reads only Counter-Strike 2 and finishes in seconds; the GitHub repositories
# are polled hourly and the news feeds every twenty minutes or so.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send Telegram messages, print them instead"
        type: boolean
        default: false
      log_level:
        description: "Log level"
        type: choice
        options: [INFO, DEBUG, WARNING]
        default: INFO

permissions:
  contents: read
  actions: write   # read the previous state artifact, replace it at the end

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Record start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Depot build ids are not reachable over the Web API; steamcmd with an
      # anonymous login is the only route. Cached because the tarball never
      # changes and the self-update is the slow part.
      - name: Cache steamcmd
        id: steamcmd-cache
        uses: actions/cache@v4
        with:
          path: ~/steamcmd
          key: steamcmd-${{ runner.os }}-v1

      - name: Install steamcmd
        run: |
          set -eu
          if [ ! -x "$HOME/steamcmd/steamcmd.sh" ]; then
            mkdir -p "$HOME/steamcmd"
            curl -sSL --retry 3 \
              https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
              | tar xz -C "$HOME/steamcmd"
          fi
          # the bootstrap binary is 32-bit; without this it cannot start
          if ! dpkg -l lib32gcc-s1 >/dev/null 2>&1; then
            sudo dpkg --add-architecture i386
            sudo apt-get update -qq
            sudo apt-get install -y -qq lib32gcc-s1
          fi
          "$HOME/steamcmd/steamcmd.sh" +quit >/dev/null 2>&1 || true
          echo "steamcmd ready"

      - name: Choose the state backend
        id: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "mode=postgres" >> "$GITHUB_OUTPUT"
          else
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore state from the previous run
        if: steps.backend.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=monitor-state&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::notice::no previous state artifact -- the first run only records a baseline"
            exit 0
          fi
          curl -sSL --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
            -o state.zip
          unzip -oq state.zip -d data/
          gunzip -f data/monitor.db.gz
          echo "restored $(du -h data/monitor.db | cut -f1) of state"

      - name: Watch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/monitor.db' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # routine runs are delivered silently and changes are not, so an
          # unmuted chat rings for exactly the right ones
          TELEGRAM_HEARTBEAT: ${{ vars.TELEGRAM_HEARTBEAT }}
          TELEGRAM_HEARTBEAT_MIN_INTERVAL_MINUTES: ${{ vars.TELEGRAM_HEARTBEAT_MIN_INTERVAL_MINUTES }}
          # free, and raises the GitHub API limit from 60/h to 1000/h
          GITHUB_TOKEN: ${{ github.token }}
          STEAMCMD_PATH: /home/runner/steamcmd/steamcmd.sh
          # optional; unlocks the CS2 matchmaking/scheduler signal
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          DELTA_ALERT_FRACTION: ${{ vars.DELTA_ALERT_FRACTION }}
          WATCH_INTERVAL: ${{ vars.WATCH_INTERVAL || '300' }}
          WATCH_MAX_RUNTIME: ${{ vars.WATCH_MAX_RUNTIME || '3000' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Los_Angeles' }}
          RATE_MULTIPLIER: ${{ vars.RATE_MULTIPLIER }}
          RATE_MIN_ABSOLUTE_DELTA: ${{ vars.RATE_MIN_ABSOLUTE_DELTA }}
          MIN_BASELINE_SAMPLES: ${{ vars.MIN_BASELINE_SAMPLES }}
          BASELINE_LOOKBACK_WEEKS: ${{ vars.BASELINE_LOOKBACK_WEEKS }}
          OBSERVATION_RETENTION_DAYS: ${{ vars.OBSERVATION_RETENTION_DAYS }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
          LOG_FORMAT: json
          PYTHONUNBUFFERED: "1"
        run: |
          python -m scripts.watch \
            --loop \
            --interval "${WATCH_INTERVAL:-300}" \
            --max-runtime "${WATCH_MAX_RUNTIME:-3000}"

      - name: Compress state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db') != ''
        run: gzip -9 -c data/monitor.db > data/monitor.db.gz

      - name: Persist state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: data/monitor.db.gz
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # Hand off to the next job. Runs even when the pass failed -- otherwise a
      # single bad minute would end the chain permanently -- but never sooner
      # than five minutes after this job started, so a job that dies instantly
      # cannot spin.
      - name: Chain the next run
        if: always() && github.event_name != 'pull_request'
        env:
          CHAIN_TOKEN: ${{ secrets.WORKFLOW_CHAIN_TOKEN }}
          STARTED_AT: ${{ steps.started.outputs.epoch }}
        run: |
          set -eu
          if [ -z "${CHAIN_TOKEN:-}" ]; then
            echo "::warning::WORKFLOW_CHAIN_TOKEN is not set -- the chain stops here."
            echo "Create a fine-grained PAT with Actions: read and write on this"
            echo "repository and add it as WORKFLOW_CHAIN_TOKEN, or trigger the"
            echo "workflow manually. The built-in GITHUB_TOKEN cannot do this:"
            echo "GitHub refuses to start a run from an event it raised."
            exit 0
          fi
          elapsed=$(( $(date +%s) - ${STARTED_AT:-0} ))
          floor=300
          if [ "$elapsed" -lt "$floor" ]; then
            echo "job lasted ${elapsed}s; waiting $(( floor - elapsed ))s before chaining"
            sleep $(( floor - elapsed ))
          fi
          code=$(curl -sS -o /tmp/chain.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CHAIN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
          if [ "$code" = "204" ]; then
            echo "next run dispatched"
          else
            echo "::error::dispatch failed with HTTP $code: $(cat /tmp/chain.json)"
            exit 1
          fi
