name: watch

# Valve's public state changes a few times a day at most, so this runs on a
# modest interval rather than continuously. Every endpoint it uses is free and
# keyless, so the interval is bounded by politeness and Actions minutes, not by
# a quota.
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, offset off the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send Telegram messages, print them instead"
        type: boolean
        default: false
      log_level:
        description: "Log level"
        type: choice
        options: [INFO, DEBUG, WARNING]
        default: INFO

permissions:
  contents: read
  actions: write   # read the previous state artifact, replace it at the end

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Choose the state backend
        id: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "mode=postgres" >> "$GITHUB_OUTPUT"
          else
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore state from the previous run
        if: steps.backend.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=monitor-state&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::notice::no previous state artifact -- the first run only records a baseline"
            exit 0
          fi
          curl -sSL --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
            -o state.zip
          unzip -oq state.zip -d data/
          gunzip -f data/monitor.db.gz
          echo "restored $(du -h data/monitor.db | cut -f1) of state"

      - name: Watch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///data/monitor.db' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # a plain @username mention breaks through a muted chat, so routine
          # runs stay silent and only real changes ping
          TELEGRAM_MENTION: ${{ vars.TELEGRAM_MENTION }}
          TELEGRAM_HEARTBEAT: ${{ vars.TELEGRAM_HEARTBEAT }}
          TELEGRAM_HEARTBEAT_MIN_INTERVAL_MINUTES: ${{ vars.TELEGRAM_HEARTBEAT_MIN_INTERVAL_MINUTES }}
          # free, and raises the GitHub API limit from 60/h to 1000/h
          GITHUB_TOKEN: ${{ github.token }}
          # optional; unlocks the CS2 matchmaking/scheduler signal
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          DELTA_ALERT_FRACTION: ${{ vars.DELTA_ALERT_FRACTION }}
          OFFICE_TIMEZONE: ${{ vars.OFFICE_TIMEZONE || 'America/Los_Angeles' }}
          ANOMALY_MULTIPLIER: ${{ vars.ANOMALY_MULTIPLIER }}
          MIN_BASELINE_SAMPLES: ${{ vars.MIN_BASELINE_SAMPLES }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
          LOG_FORMAT: json
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.watch

      - name: Compress state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db') != ''
        run: gzip -9 -c data/monitor.db > data/monitor.db.gz

      - name: Persist state
        if: steps.backend.outputs.mode == 'artifact' && always() && hashFiles('data/monitor.db.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: data/monitor.db.gz
          retention-days: 30
          overwrite: true
          if-no-files-found: error
